<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лабораторна робота №2 - Школа</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Школа</h1>

  <!-- Таби -->
  <button id="tab-subjects">Предмети</button>
  <button id="tab-teachers">Вчителі</button>

  <div id="subjects-block">
    <h2>Предмети</h2>

    <h3>Додати предмет</h3>
    <div>
      <input id="subjects-name" placeholder="Назва">
      <input id="subjects-department" placeholder="Кафедра">
      <input id="subjects-hours" type="number" placeholder="Годин на рік">
      <input id="subjects-grade" type="number" placeholder="Клас">
      <input id="subjects-room" placeholder="Кабінет">
      <input id="subjects-difficulty" type="number" placeholder="Складність 1-5">
      <select id="subjects-mandatory">
        <option value="Так">Обов'язковий: Так</option>
        <option value="Ні">Обов'язковий: Ні</option>
      </select>
      <button id="add-subjects">Додати</button>
    </div>

    <table id="subjects-table"></table>
  </div>

  <div id="teachers-block">
    <h2>Вчителі</h2>

    <h3>Додати вчителя</h3>
    <div>
      <input id="teachers-fullName" placeholder="ПІБ">
      <select id="teachers-subject"></select>
      <input id="teachers-email" placeholder="Email">
      <input id="teachers-phone" placeholder="Телефон">
      <input id="teachers-rate" type="number" step="0.25" placeholder="Ставка">
      <input id="teachers-experience" type="number" placeholder="Стаж">
      <select id="teachers-category">
        <option value="Спеціаліст">Спеціаліст</option>
        <option value="Друга">Друга</option>
        <option value="Перша">Перша</option>
        <option value="Вища">Вища</option>
      </select>
      <button id="add-teachers">Додати</button>
    </div>

    <table id="teachers-table"></table>
  </div>

  <dialog id="message-dialog">
    <p id="message-text"></p>
    <button id="message-close">OK</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
